    <style>
        /* --- Sci-Fi Core Tokens & Reset --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 70%),
                radial-gradient(circle at 0% 100%, #1e1b4b 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, #042f2e 0%, transparent 40%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            padding-bottom: 5rem;
        }

        /* Subtle Digital Grid Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 24, 38, 0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(18, 24, 38, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 999;
        }

        /* --- Header & Holographic Navigation --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.25rem 2rem;
            background: rgba(3, 7, 18, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(6, 182, 212, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .navBar {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            position: relative;
        }

        .navBar:hover, .navBar:focus {
            color: #00f2fe;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
        }

        /* Sci-Fi Nav Underline Effect */
        .navBar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f2fe, transparent);
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        .navBar:hover::after {
            width: 100%;
        }

        /* Cyber Button Styling (Preserving existing IDs) */
        #contactAndHireMeButton {
            background: rgba(6, 182, 212, 0.05);
            color: #00f2fe;
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 0.6rem 1.2rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.08em;
            position: relative;
            clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
        }

        #contactAndHireMeButton:hover {
            background: rgba(6, 182, 212, 0.2);
            color: #ffffff;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: translateY(-2px);
        }

        #contactAndHireMeButton i {
            margin-left: 0.5rem;
            font-size: 14px;
        }

        /* Pushing buttons to the right logically if screen allows */
        nav a:has(#contactAndHireMeButton) {
            margin-left: auto;
        }
        nav a + a:has(#contactAndHireMeButton) {
            margin-left: 0;
        }

        /* --- Global Typography --- */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            margin: 3.5rem 0 2rem 0;
            background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #7c3aed 100%);
            -webkit-background-clip:text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.3));
        }

        /* --- Advanced Sci-Fi Image Matrix Grid --- */
        .images {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* Target the image wrapper / image tag safely to ensure responsive scaling */
        img.images {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 405 / 257;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            filter: grayscale(15%) brightness(90%);
            cursor: pointer;
        }

        /* Interactive Cyber Hover States */
        img.images:hover {
            transform: scale(1.04) translateY(-5px);
            filter: grayscale(0%) brightness(105%);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.35), 0 10px 30px rgba(0,0,0,0.5);
            outline: none;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            nav {
                justify-content: center;
            }
            nav a:has(#contactAndHireMeButton) {
                margin-left: 0;
            }
            h1 {
                font-size: 1.8rem;
                margin: 2rem 0 1.5rem 0;
            }
            .images {
                padding: 0 1rem;
                gap: 1.25rem;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            }
        }

        /* Custom Tech Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.6);
        }
    </style>
</head>
